# Keeps the SHA-pinned workflow actions fresh: Dependabot re-pins
# @<40-char-sha> whenever the tag in the trailing comment (# vX) moves.
# The semgrep job skips dependabot[bot] PRs; lint/type/build/docs run on them.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Semgrep (dependabot-missing-cooldown): wait 7 days before proposing
    # newly published package versions - fresh releases can be malicious.
    cooldown:
      default-days: 7
