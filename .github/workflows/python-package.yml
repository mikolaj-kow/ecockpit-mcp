# CI gates: ruff (lint + format), mypy on the CPython half,
# coverage-gated offline tests, sdist/wheel build + entry-point smoke,
# strict mkdocs build. executor.py / relay.py are IronPython scripts
# (they run inside e!COCKPIT) - ruff/mypy skip them; a bare syntax check
# keeps accidental py3-only syntax out of the IronPython pair.

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install ruff
      run: python -m pip install ruff
    - name: Lint (ruff check)
      run: ruff check .
    - name: Format (ruff format --check)
      run: ruff format --check .
    - name: IronPython pair syntax check (E9 only)
      run: |
        ruff check --select E9 --no-cache \
          src/ecockpit_mcp/executor.py src/ecockpit_mcp/relay.py

  type:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install mypy + package deps
      run: |
        python -m pip install mypy
        python -m pip install mcp
    - name: Type-check the CPython half (mypy)
      run: mypy

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12", "3.13","3.14", "3.15",]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov mcp
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Test with pytest (coverage gate on the host half)
      run: |
        pytest --cov-fail-under=55
    - name: Build sdist and wheel
      run: |
        python -m pip install build
        python -m build
    - name: Install wheel and check entry point
      run: |
        python -m pip install --force-reinstall dist/*.whl
        ecockpit-mcp --help

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install mkdocs-material
      run: python -m pip install mkdocs-material
    - name: Build documentation (strict)
      run: python -m mkdocs build --strict --site-dir site
    - uses: actions/upload-artifact@v4
      with:
        name: docs-site
        path: site/
