# Semgrep Community Edition (no SEMGREP_APP_TOKEN, no semgrep.dev account).
# Advisory: `semgrep scan` exits 0 on findings unless --error is passed, so
# this job never blocks a PR. Results land in Security -> Code scanning via
# SARIF upload (free for public repos). To turn it into a hard gate later,
# append --error to the scan command (triage what's on main first).
# Actions are SHA-pinned (full 40-char commit) to satisfy the scanner's own
# `github-actions-mutable-action-tag` rule; bump by editing the SHA.
# Schedules, cron and the container image follow the official CE sample:
# https://docs.semgrep.dev/semgrep-ci/sample-ci-configs#semgrep-ce

name: Semgrep CE scan

on:
  # Scan in PRs:
  pull_request: {}
  # Scan on-demand through GitHub Actions interface:
  workflow_dispatch: {}
  # Scan mainline branches and report all findings:
  push:
    branches: ["main"]
  # Scheduled full scan (random time per docs recommendation):
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: read
  # Required to publish SARIF results to the code scanning dashboard:
  security-events: write

jobs:
  semgrep:
    name: semgrep-oss/scan
    runs-on: ubuntu-latest

    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      # Fetch project source with GitHub Actions Checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Text output goes to the job log; a SARIF copy goes to the dashboard.
      - name: Semgrep CE scan (advisory)
        run: semgrep scan --config auto --sarif-output=semgrep.sarif
      # nosemgrep-suppressed findings DO land in the SARIF (marked with the
      # `suppressions` field), but GitHub ignores that field and imports them
      # as alerts - drop them before upload.
      - name: Drop suppressed findings from SARIF
        run: |
          python3 - <<'PY'
          import json
          with open("semgrep.sarif") as fh:
              sarif = json.load(fh)
          for run in sarif.get("runs", []):
              run["results"] = [
                  r for r in run.get("results", []) if not r.get("suppressions")
              ]
          with open("semgrep.sarif", "w") as fh:
              json.dump(sarif, fh)
          PY
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep-ce
