# Pre-commit gates for the CPython half (server.py, tests, smoke
# client). executor.py / relay.py are IronPython scripts running inside
# e!COCKPIT - ruff's py310 assumptions don't apply, so they are excluded
# in pyproject.toml; CI keeps a bare syntax check over them.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # mkdocs.yml uses !!python/name: tags (pymdownx superfences).
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
        exclude: ^(site/|docs/)
      - id: trailing-whitespace
        exclude: ^(site/|docs/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: ^src/ecockpit_mcp/(server|__init__)\.py$
        # server.py imports the mcp SDK (py.typed); without it in the
        # isolated hook env every import is an error.
        additional_dependencies: ["mcp>=2.3"]
